<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFORMATIKA FUN - Pilih Kelas</title>
    
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* ==========================================================================
           TEMA: INFORMATIKA FUN (DARK BLUE & MINT GREEN)
           Sesuai Referensi Gambar Screenshot 2026-10-20 160452.png
           ========================================================================== */
        
        :root {
            /* Palet Warna Sesuai Screenshot Baru */
            --bg-main: #567C9C;        /* Biru medium untuk latar belakang halaman */
            --card-bg: #283E56;        /* Biru dongker (navy) gelap untuk latar kartu */
            --accent-green: #78B89E;   /* Hijau mint untuk ikon dan garis tepi kartu */
            --text-light: #FFFFFF;     /* Putih untuk teks utama */
            --text-muted: #E2E8F0;     /* Putih keabu-abuan untuk subjudul */
            
            /* Bayangan & Transisi */
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            --hover-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 1. Reset & Background Dasar */
        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* 2. Latar Belakang Animasi Informatika (Dibuat samar/putih) */
        .bg-floating-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: -1;
            opacity: 0.1; /* Transparansi rendah agar tidak mengganggu teks */
            color: #FFFFFF; /* Ubah ikon latar menjadi putih */
            overflow: hidden;
        }

        .bg-item {
            position: absolute;
            font-weight: 700;
            animation: float-anim 10s infinite ease-in-out alternate;
        }

        @keyframes float-anim {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(5deg); }
        }

        /* Penempatan elemen dekoratif */
        .bg-code { top: 15%; left: 10%; font-size: 1.5rem; }
        .bg-bracket { top: 30%; right: 15%; font-size: 2rem; }
        .bg-binary { bottom: 20%; left: 15%; font-size: 1.2rem; }
        .bg-binary-2 { top: 50%; right: 10%; font-size: 1.2rem; }
        .bg-icon-1 { top: 25%; left: 30%; font-size: 1.5rem; animation-duration: 12s;}
        .bg-icon-2 { bottom: 30%; right: 25%; font-size: 1.5rem; animation-duration: 9s;}
        .bg-icon-3 { bottom: 15%; left: 40%; font-size: 1.5rem; animation-duration: 14s;}
        .bg-icon-4 { top: 10%; right: 40%; font-size: 1.5rem; }
        .bg-icon-5 { top: 60%; left: 10%; font-size: 1.5rem; }
        .bg-icon-6 { bottom: 10%; right: 10%; font-size: 1.5rem; }
        .bg-icon-7 { top: 75%; left: 25%; font-size: 1.5rem; }
        .bg-icon-8 { top: 40%; right: 30%; font-size: 1.5rem; }
        .dot-node { width: 8px; height: 8px; background: #FFFFFF; border-radius: 50%; }
        .node-1 { top: 20%; left: 50%; }
        .node-2 { bottom: 25%; right: 50%; }

        /* 3. Header & Brand (Disesuaikan agar serasi) */
        .site-header {
            margin-top: 2rem;
            margin-bottom: 1rem;
            z-index: 1;
        }

        .brand-badge {
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 20px;
            border-radius: 30px;
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-badge i { color: var(--accent-green); }

        /* 4. Konten Utama & Judul */
        .main-container {
            text-align: center;
            width: 100%;
            max-width: 1100px;
            padding: 0 2rem;
            box-sizing: border-box;
            z-index: 1;
            flex-grow: 1;
        }

        .main-title {
            color: var(--text-light);
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sub-title {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 4rem;
            font-weight: 400;
        }

        /* 5. Bento Grid - Tiga Tombol Kelas (Horizontal) */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 2rem;
            width: 100%;
        }

        .bento-card {
            background: var(--card-bg);
            border: 2px solid var(--accent-green);
            border-radius: 16px; /* Ujung agak membulat sesuai gambar */
            padding: 3rem 1.5rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            outline: none;
            user-select: none;
        }

        /* Efek Hover Seragam (Warna Sedikit Terang) */
        .bento-card:hover, .bento-card:focus {
            background: #304964; /* Biru navy lebih terang sedikit saat di-hover */
            border-color: #92CDB5; /* Hijau mint lebih terang */
            transform: translateY(-5px);
            box-shadow: var(--hover-shadow);
        }

        /* Ikon Dekoratif di dalam Kartu */
        .decor-icons {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: flex;
            gap: 15px;
            transition: var(--transition-smooth);
            color: var(--accent-green); /* Sesuai warna hijau di gambar */
        }

        .bento-card:hover .small-icon {
            transform: scale(1.1);
        }

        .class-title {
            color: var(--text-light);
            margin: 0;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 1; /* Pastikan di atas ripple */
        }

        /* 6. Interaksi JavaScript & Efek Ripple */
        .is-pressed {
            transform: scale(0.96) !important;
        }

        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(120, 184, 158, 0.3); /* Riak warna hijau mint transparan */
            transform: scale(0);
            animation: ripple-anim 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-anim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* 7. Footer */
        .site-footer {
            margin-top: 4rem;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            z-index: 1;
            opacity: 0.8;
        }

        /* 8. Responsivitas untuk Tablet dan Ponsel */
        @media (max-width: 992px) {
            .bento-grid {
                gap: 1.5rem;
            }
            .main-title { font-size: 2.8rem; }
            .bento-card { padding: 2.5rem 1rem; }
            .class-title { font-size: 1.4rem; }
        }

        @media (max-width: 768px) {
            /* Pada layar kecil, susun menjadi vertikal */
            .bento-grid {
                grid-template-columns: 1fr;
                max-width: 400px;
                margin: 0 auto;
            }
            .main-title { font-size: 2.2rem; }
            .sub-title { font-size: 1rem; margin-bottom: 2.5rem; }
            .bg-floating-container { display: none; /* Kurangi beban visual di HP */ }
        }

        /* Aksesibilitas (Prefers Reduced Motion) */
        @media (prefers-reduced-motion: reduce) {
            .bg-item { animation: none; }
            .bento-card { transition: none; }
            .bento-card:hover { transform: none; }
            .is-pressed { transform: none !important; }
        }
    </style>
</head>
<body>

    <!-- Latar Belakang Animasi Informatika -->
    <div class="bg-floating-container" aria-hidden="true">
        <span class="bg-item bg-code">&lt;/&gt;</span>
        <span class="bg-item bg-bracket">{ }</span>
        <span class="bg-item bg-binary">01</span>
        <span class="bg-item bg-binary-2">101</span>
        <i class="fa-solid fa-laptop bg-item bg-icon-1"></i>
        <i class="fa-solid fa-computer-mouse bg-item bg-icon-2"></i>
        <i class="fa-solid fa-keyboard bg-item bg-icon-3"></i>
        <i class="fa-solid fa-cloud bg-item bg-icon-4"></i>
        <i class="fa-solid fa-network-wired bg-item bg-icon-5"></i>
        <i class="fa-solid fa-microchip bg-item bg-icon-6"></i>
        <i class="fa-solid fa-folder-open bg-item bg-icon-7"></i>
        <i class="fa-solid fa-database bg-item bg-icon-8"></i>
        <div class="bg-item dot-node node-1"></div>
        <div class="bg-item dot-node node-2"></div>
    </div>

    <!-- Header Identitas Website -->
    <header class="site-header">
        <div class="brand-badge">
            <i class="fa-solid fa-cubes"></i>
            <span>INFORMATIKA FUN</span>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="main-container">
        <!-- Judul & Subjudul -->
        <section class="hero-section">
            <h1 class="main-title">PILIH KELAS</h1>
            <p class="sub-title">Mari belajar Informatika dengan cara yang seru dan menyenangkan!</p>
        </section>

        <!-- Bento Grid 3 Tombol Kelas -->
        <section class="bento-grid">
            
            <!-- Tombol Kelas VII -->
            <div class="bento-card card-vii" data-url="https://riski902-alt.github.io/MATERIKELASVII/" role="button" tabindex="0" aria-label="Pilih Kelas VII">
                <div class="decor-icons">
                    <i class="fa-solid fa-laptop small-icon"></i>
                    <i class="fa-solid fa-keyboard small-icon"></i>
                </div>
                <h2 class="class-title">KELAS VII</h2>
            </div>

            <!-- Tombol Kelas VIII -->
            <div class="bento-card card-viii" data-url="https://riski902-alt.github.io/MATERIKELASVIII/" role="button" tabindex="0" aria-label="Pilih Kelas VIII">
                <div class="decor-icons">
                    <i class="fa-solid fa-code small-icon"></i>
                    <i class="fa-solid fa-cloud small-icon"></i>
                </div>
                <h2 class="class-title">KELAS VIII</h2>
            </div>

            <!-- Tombol Kelas IX -->
            <div class="bento-card card-ix" data-url="https://riski902-alt.github.io/MATERIKELASIX/" role="button" tabindex="0" aria-label="Pilih Kelas IX">
                <div class="decor-icons">
                    <i class="fa-solid fa-microchip small-icon"></i>
                    <i class="fa-solid fa-network-wired small-icon"></i>
                </div>
                <h2 class="class-title">KELAS IX</h2>
            </div>

        </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>INFORMATIKA FUN @ By: Riski Amalia, S.Pd</p>
    </footer>

    <!-- JavaScript Internal -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.bento-card');

            cards.forEach(card => {
                // Event Listener untuk Klik Mouse & Sentuhan Layar
                card.addEventListener('click', function (e) {
                    handleNavigation(this, e);
                });

                // Aksesibilitas Keyboard (Tekan Enter atau Space)
                card.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        handleNavigation(this, e);
                    }
                });
            });

            /**
             * Menangani efek animasi klik/press dan navigasi halaman
             */
            function handleNavigation(cardElement, event) {
                const targetUrl = cardElement.getAttribute('data-url');
                if (!targetUrl) return;

                // 1. Jalankan Efek Press / Bounce
                cardElement.classList.add('is-pressed');

                // 2. Buat Efek Ripple Lembut
                createRipple(cardElement, event);

                // 3. Berpindah Halaman Setelah Animasi Selesai (300ms)
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 300);
            }

            /**
             * Membuat efek riak (ripple effect) secara dinamis pada kartu
             */
            function createRipple(card, event) {
                const circle = document.createElement('span');
                const diameter = Math.max(card.clientWidth, card.clientHeight);
                const radius = diameter / 2;

                const rect = card.getBoundingClientRect();
                
                // Menghitung posisi klik (jika lewat keyboard, posisikan di tengah)
                const clientX = event.clientX || (rect.left + rect.width / 2);
                const clientY = event.clientY || (rect.top + rect.height / 2);

                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${clientX - rect.left - radius}px`;
                circle.style.top = `${clientY - rect.top - radius}px`;
                circle.classList.add('ripple-effect');

                // Hapus elemen ripple lama jika ada
                const existingRipple = card.querySelector('.ripple-effect');
                if (existingRipple) {
                    existingRipple.remove();
                }

                card.appendChild(circle);
            }
        });
    </script>
</body>
</html>
